services:
  - type: web
    name: india-power-dashboard
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    # Single-page-app fallback: serve index.html for any unmatched route so
    # client-side navigation and deep links don't 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
